title: DSMLP Documentation
title_short: DSMLP
description: Documentation for UC San Diego's Data Science / Machine Learning Platform and related services.
url: https://dsmlp-docs.ucsd.edu
baseurl: ""
feedback_email: ets-docs@ucsd.edu

# Pretty URLs: docs/getting-started/accounts/index.html rather than
# accounts.html, so _data/navigation.yml and in-page links can use
# trailing-slash paths consistently.
permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Jekyll 4 + jekyll-sass-converter 3.x (Dart Sass).
sass:
  style: compressed
  sourcemap: never

# docs/ is raw Markdown with no front matter, so Jekyll would otherwise
# copy it through as static files. _plugins/vanilla_docs.rb reads it from
# disk and generates real pages from it, so the raw tree is excluded here.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DECORATOR.md
  - docs
  - vendor
  - node_modules
