name: Build and deploy

# Built with Jekyll 4 on Actions rather than the built-in GitHub Pages
# builder. The built-in builder pins Jekyll 3.10.0 / jekyll-sass-converter
# 1.5.2 (Ruby Sass 3.7.4, EOL 2019), runs in safe mode with a fixed plugin
# allowlist, and cannot run the Node-based Decorator chrome integrity gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Decorator chrome integrity gate — tiers 1/3/4 catch shell edits,
      # structural breaks, and site CSS/JS reaching into the chrome.
      #
      # continue-on-error is here ONLY because no golden baseline has been
      # recorded yet (tier 2). A human reviews the rendered chrome once and
      # runs, from the built _site directory:
      #
      #   node checks/chrome-contract.mjs --accept --reason "initial baseline"
      #
      # then commits chrome-contract.local.json and flips this to blocking.
      # Never run --accept from CI or from an agent.
      - name: Decorator chrome integrity gate
        continue-on-error: true
        working-directory: _site
        run: npx -y github:UCSD/decorator-kit verify || node "$(npm root -g)/ucsd-decorator-kit/checks/chrome-contract.mjs" --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
